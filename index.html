<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />

  <title>BalTracker — Know Your Money. Control Your Business.</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --primary-light:#eff6ff;

      --green:#16a34a;
      --green-light:#f0fdf4;

      --red:#dc2626;
      --red-light:#fef2f2;

      --orange:#ea580c;
      --orange-light:#fff7ed;

      --purple:#7c3aed;
      --purple-light:#f5f3ff;

      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --bg:#f8fafc;
      --white:#ffffff;

      --sidebar:250px;
      --radius:16px;

      --shadow:
        0 10px 30px rgba(15,23,42,.06);
    }

    body{
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    /* =========================
       APP LAYOUT
    ========================= */

    .app{
      min-height:100vh;
      display:flex;
    }

    .sidebar{
      width:var(--sidebar);
      background:#fff;
      border-right:1px solid var(--border);
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      z-index:100;
      display:flex;
      flex-direction:column;
      padding:22px 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:4px 10px 26px;
    }

    .brand-icon{
      width:38px;
      height:38px;
      border-radius:12px;
      background:linear-gradient(135deg,#2563eb,#4f46e5);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:18px;
      box-shadow:0 8px 18px rgba(37,99,235,.22);
    }

    .brand-text{
      font-size:20px;
      font-weight:800;
      letter-spacing:-.5px;
    }

    .brand-text span{
      color:var(--primary);
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:5px;
      flex:1;
    }

    .nav button{
      width:100%;
      border:0;
      background:transparent;
      color:#64748b;
      padding:11px 12px;
      border-radius:11px;
      display:flex;
      align-items:center;
      gap:11px;
      text-align:left;
      font-weight:600;
      font-size:14px;
      transition:.2s;
    }

    .nav button:hover{
      background:#f8fafc;
      color:var(--text);
    }

    .nav button.active{
      background:var(--primary-light);
      color:var(--primary);
    }

    .nav-icon{
      width:20px;
      text-align:center;
      font-size:17px;
    }

    .sidebar-footer{
      border-top:1px solid var(--border);
      padding-top:15px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    /* =========================
       MAIN
    ========================= */

    .main{
      margin-left:var(--sidebar);
      width:calc(100% - var(--sidebar));
      min-height:100vh;
    }

    .topbar{
      height:72px;
      background:#fff;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
      position:sticky;
      top:0;
      z-index:50;
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .mobile-menu{
      display:none;
      border:0;
      background:#f1f5f9;
      width:40px;
      height:40px;
      border-radius:10px;
      font-size:20px;
    }

    .page-title{
      font-size:18px;
      font-weight:750;
    }

    .connection{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:12px;
      color:var(--muted);
    }

    .connection-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
    }

    .connection.offline .connection-dot{
      background:var(--orange);
    }

    .content{
      padding:28px;
      max-width:1500px;
      margin:auto;
    }

    /* =========================
       COMMON
    ========================= */

    .page-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:25px;
    }

    .page-header h1{
      font-size:27px;
      letter-spacing:-.7px;
      margin-bottom:5px;
    }

    .page-header p{
      color:var(--muted);
      font-size:14px;
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:11px 16px;
      font-size:13px;
      font-weight:700;
      transition:.2s;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
      transform:translateY(-1px);
    }

    .btn-secondary{
      background:#f1f5f9;
      color:#334155;
    }

    .btn-secondary:hover{
      background:#e2e8f0;
    }

    .btn-danger{
      background:var(--red);
      color:#fff;
    }

    .btn-success{
      background:var(--green);
      color:#fff;
    }

    .btn-small{
      padding:8px 11px;
      font-size:12px;
      border-radius:9px;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    /* =========================
       DASHBOARD
    ========================= */

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:20px;
    }

    .stat-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:19px;
      box-shadow:var(--shadow);
    }

    .stat-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:13px;
    }

    .stat-label{
      color:var(--muted);
      font-size:12px;
      font-weight:650;
    }

    .stat-icon{
      width:35px;
      height:35px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
    }

    .icon-blue{
      background:var(--primary-light);
      color:var(--primary);
    }

    .icon-green{
      background:var(--green-light);
      color:var(--green);
    }

    .icon-orange{
      background:var(--orange-light);
      color:var(--orange);
    }

    .icon-red{
      background:var(--red-light);
      color:var(--red);
    }

    .stat-value{
      font-size:23px;
      font-weight:800;
      letter-spacing:-.5px;
    }

    .stat-sub{
      margin-top:5px;
      font-size:11px;
      color:var(--muted);
    }

    .dashboard-grid{
      display:grid;
      grid-template-columns:1.45fr .8fr;
      gap:20px;
    }

    .section-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 20px;
      border-bottom:1px solid var(--border);
    }

    .section-header h3{
      font-size:15px;
    }

    .section-header button{
      border:0;
      background:transparent;
      color:var(--primary);
      font-size:12px;
      font-weight:700;
    }

    .section-body{
      padding:20px;
    }

    /* =========================
       BUSINESS HEALTH
    ========================= */

    .health-card{
      padding:20px;
    }

    .health-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
    }

    .health-head h3{
      font-size:15px;
      margin-bottom:4px;
    }

    .health-head p{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    .health-status{
      padding:6px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .health-gauge{
      margin-top:20px;
      position:relative;
      display:flex;
      justify-content:center;
    }

    .gauge{
      width:230px;
      height:125px;
    }

    .gauge svg{
      width:100%;
      height:100%;
      overflow:visible;
    }

    .gauge .track{
      fill:none;
      stroke:#e2e8f0;
      stroke-width:10;
      stroke-linecap:round;
    }

    .gauge .value{
      fill:none;
      stroke-width:10;
      stroke-linecap:round;
      transition:
        stroke-dashoffset .7s ease,
        stroke .3s ease;
    }

    .gauge-score{
      position:absolute;
      bottom:2px;
      left:50%;
      transform:translateX(-50%);
      text-align:center;
    }

    .gauge-score strong{
      display:block;
      font-size:27px;
      line-height:1;
    }

    .gauge-score span{
      color:var(--muted);
      font-size:11px;
    }

    .health-message{
      text-align:center;
      margin-top:5px;
      font-size:12px;
      color:var(--muted);
    }

    .health-breakdown{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:7px;
    }

    .health-mini{
      background:#f8fafc;
      border-radius:10px;
      padding:9px;
      text-align:center;
    }

    .health-mini strong{
      display:block;
      font-size:13px;
    }

    .health-mini span{
      font-size:9px;
      color:var(--muted);
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .quick-action{
      border:1px solid var(--border);
      background:#fff;
      border-radius:13px;
      padding:15px;
      display:flex;
      align-items:center;
      gap:11px;
      text-align:left;
      transition:.2s;
    }

    .quick-action:hover{
      border-color:#cbd5e1;
      transform:translateY(-1px);
      box-shadow:0 5px 15px rgba(15,23,42,.05);
    }

    .quick-icon{
      width:35px;
      height:35px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
    }

    .quick-action strong{
      display:block;
      font-size:12px;
    }

    .quick-action span{
      color:var(--muted);
      font-size:10px;
    }

    /* =========================
       TRANSACTION LIST
    ========================= */

    .transaction-list{
      display:flex;
      flex-direction:column;
    }

    .transaction-row{
      display:grid;
      grid-template-columns:42px 1fr auto auto;
      align-items:center;
      gap:13px;
      padding:13px 20px;
      border-bottom:1px solid #f1f5f9;
    }

    .transaction-row:last-child{
      border-bottom:0;
    }

    .tx-icon{
      width:37px;
      height:37px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:700;
    }

    .tx-main strong{
      display:block;
      font-size:13px;
      margin-bottom:3px;
    }

    .tx-main span{
      display:block;
      font-size:11px;
      color:var(--muted);
    }

    .tx-amount{
      font-weight:800;
      font-size:13px;
    }

    .amount-positive{
      color:var(--green);
    }

    .amount-negative{
      color:var(--red);
    }

    .badge{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:5px 8px;
      font-size:10px;
      font-weight:750;
    }

    .badge-sale{
      background:#eff6ff;
      color:#2563eb;
    }

    .badge-expense{
      background:#fef2f2;
      color:#dc2626;
    }

    .badge-credit{
      background:#fff7ed;
      color:#ea580c;
    }

    .badge-debit{
      background:#f5f3ff;
      color:#7c3aed;
    }

    .empty{
      text-align:center;
      padding:35px 20px;
      color:var(--muted);
      font-size:13px;
    }

    /* =========================
       LEDGER
    ========================= */

    .filters{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:17px;
    }

    .search{
      flex:1;
      min-width:190px;
      position:relative;
    }

    .search input{
      width:100%;
      height:43px;
      border:1px solid var(--border);
      border-radius:11px;
      padding:0 14px;
      outline:none;
      background:#fff;
    }

    .search input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }

    .filter-select{
      height:43px;
      border:1px solid var(--border);
      border-radius:11px;
      padding:0 12px;
      background:#fff;
      outline:none;
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:700px;
    }

    th,
    td{
      padding:13px 16px;
      text-align:left;
      border-bottom:1px solid #f1f5f9;
      font-size:12px;
    }

    th{
      background:#f8fafc;
      color:var(--muted);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-weight:800;
    }

    td{
      color:#334155;
    }

    td strong{
      color:var(--text);
    }

    .table-actions{
      display:flex;
      gap:5px;
    }

    .icon-btn{
      border:1px solid var(--border);
      background:#fff;
      width:30px;
      height:30px;
      border-radius:8px;
      font-size:12px;
      color:#475569;
    }

    .icon-btn:hover{
      background:#f8fafc;
    }

    /* =========================
       PEOPLE
    ========================= */

    .people-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }

    .person-card{
      border:1px solid var(--border);
      border-radius:14px;
      padding:17px;
      background:#fff;
    }

    .person-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      background:var(--primary-light);
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
    }

    .person-name{
      font-size:14px;
      font-weight:750;
      margin-bottom:4px;
    }

    .person-sub{
      color:var(--muted);
      font-size:11px;
    }

    .person-actions{
      margin-top:16px;
      display:flex;
      gap:7px;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-grid{
      max-width:800px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .setting-card{
      padding:20px;
    }

    .setting-card h3{
      font-size:15px;
      margin-bottom:6px;
    }

    .setting-card p{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    .setting-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      padding:13px 0;
      border-bottom:1px solid #f1f5f9;
    }

    .setting-row:last-child{
      border-bottom:0;
    }

    /* =========================
       FORMS
    ========================= */

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .field.full{
      grid-column:1/-1;
    }

    label{
      font-size:12px;
      font-weight:700;
      color:#334155;
    }

    input,
    textarea{
      width:100%;
      border:1px solid #dbe3ee;
      border-radius:11px;
      min-height:45px;
      padding:0 13px;
      outline:none;
      background:#fff;
      color:#0f172a;
      font-size:13px;
    }

    textarea{
      padding:12px 13px;
      min-height:90px;
      resize:vertical;
    }

    input:focus,
    textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }

    /* =========================
       CUSTOM SELECT
    ========================= */

    .select-wrap{
      position:relative;
      width:100%;
    }

    .select-wrap select{
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;

      width:100%;
      height:46px;

      padding:0 42px 0 14px;

      border:1px solid #dbe3ee;
      border-radius:12px;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f8fafc 100%
        );

      color:#0f172a;
      font-size:14px;
      font-weight:500;

      outline:none;
      cursor:pointer;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .select-wrap select:hover{
      border-color:#bfccdc;
      background:#fff;
    }

    .select-wrap select:focus{
      border-color:#2563eb;
      background:#fff;
      box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
    }

    .select-wrap::after{
      content:"";
      position:absolute;
      right:15px;
      top:50%;

      width:8px;
      height:8px;

      border-right:2px solid #64748b;
      border-bottom:2px solid #64748b;

      transform:
        translateY(-65%)
        rotate(45deg);

      pointer-events:none;

      transition:
        transform .2s ease;
    }

    .select-wrap:focus-within::after{
      border-color:#2563eb;

      transform:
        translateY(-30%)
        rotate(225deg);
    }

    .select-wrap select:invalid{
      color:#94a3b8;
    }

    .select-wrap select option{
      color:#0f172a;
      background:#fff;
      padding:10px;
    }

    .party-switch{
      display:flex;
      justify-content:flex-end;
      margin-top:8px;
    }

    .party-switch button{
      border:0;
      background:transparent;
      color:#2563eb;
      font-size:12px;
      font-weight:650;
      padding:2px 0;
    }

    .party-switch button:hover{
      color:#1d4ed8;
      text-decoration:underline;
    }

    /* =========================
       MODAL
    ========================= */

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.48);
      backdrop-filter:blur(4px);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:500;
    }

    .overlay.show{
      display:flex;
    }

    .modal{
      width:min(560px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:18px;
      box-shadow:
        0 30px 80px rgba(15,23,42,.22);
      animation:modalIn .18s ease;
    }

    @keyframes modalIn{
      from{
        opacity:0;
        transform:translateY(12px) scale(.98);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    .modal-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding:20px;
      border-bottom:1px solid var(--border);
    }

    .modal-header h2{
      font-size:17px;
    }

    .modal-header p{
      color:var(--muted);
      font-size:11px;
      margin-top:4px;
    }

    .modal-close{
      border:0;
      background:#f1f5f9;
      width:34px;
      height:34px;
      border-radius:9px;
      font-size:18px;
      color:#64748b;
    }

    .modal-body{
      padding:20px;
    }

    .modal-footer{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      padding:15px 20px;
      border-top:1px solid var(--border);
    }

    /* =========================
       TOAST
    ========================= */

    .toast-container{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .toast{
      background:#0f172a;
      color:#fff;
      padding:12px 15px;
      border-radius:11px;
      box-shadow:0 15px 35px rgba(15,23,42,.2);
      font-size:12px;
      animation:toastIn .2s ease;
      max-width:320px;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:1100px){

      .stats-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .dashboard-grid{
        grid-template-columns:1fr;
      }

      .people-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:800px){

      .sidebar{
        transform:translateX(-100%);
        transition:.25s;
        box-shadow:10px 0 35px rgba(15,23,42,.12);
      }

      .sidebar.open{

    /* =====================================================
       HELPERS
    ===================================================== */

    function money(value){

      return new Intl.NumberFormat(
        "en-NG",
        {
          style:"currency",
          currency:"NGN",
          maximumFractionDigits:2
        }
      ).format(Number(value) || 0);

    }


    function esc(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    function formatDate(date){

      if(!date) return "—";

      const d = new Date(date);

      if(Number.isNaN(d.getTime())){
        return date;
      }

      return d.toLocaleDateString(
        "en-NG",
        {
          day:"numeric",
          month:"short",
          year:"numeric"
        }
      );

    }


    function typeLabel(type){

      return {
        sale:"Sale",
        expense:"Expense",
        credit:"Credit",
        debit:"Debit"
      }[type] || type;

    }


    function typeClass(type){

      return {
        sale:"badge-sale",
        expense:"badge-expense",
        credit:"badge-credit",
        debit:"badge-debit"
      }[type] || "";

    }


    function iconFor(type){

      return {
        sale:"↗",
        expense:"↘",
        credit:"◔",
        debit:"◑"
      }[type] || "•";

    }


    function today(){

      return new Date()
        .toISOString()
        .slice(0,10);

    }


    /* =====================================================
       TOTALS
    ===================================================== */

    function totals(){

      const sales =
        transactions
          .filter(t => t.type === "sale")
          .reduce(
            (sum,t) =>
              sum + Number(t.amount || 0),
            0
          );

      const expenses =
        transactions
          .filter(t => t.type === "expense")
          .reduce(
            (sum,t) =>
              sum + Number(t.amount || 0),
            0
          );

      const credit =
        transactions
          .filter(t => t.type === "credit")
          .reduce(
            (sum,t) =>
              sum + Number(t.balance ?? t.amount ?? 0),
            0
          );

      const debit =
        transactions
          .filter(t => t.type === "debit")
          .reduce(
            (sum,t) =>
              sum + Number(t.balance ?? t.amount ?? 0),
            0
          );

      return {
        sales,
        expenses,
        credit,
        debit,
        profit:sales-expenses,
        cash:sales-expenses
      };

    }


    /* =====================================================
       BUSINESS HEALTH
    ===================================================== */

    function calculateBusinessHealth(){

      const t = totals();

      const sales = t.sales;
      const expenses = t.expenses;
      const credit = t.credit;
      const debit = t.debit;

      if(
        sales === 0 &&
        expenses === 0 &&
        credit === 0 &&
        debit === 0
      ){

        return {
          score:0,
          status:"No activity yet",
          message:
            "Record transactions to see your business health.",
          color:"#94a3b8",
          profitScore:0,
          cashScore:0,
          debtScore:0,
          activityScore:0
        };

      }


      /* -----------------------------------------------
         PROFITABILITY — 40 POINTS
      ------------------------------------------------ */

      const profit =
        sales - expenses;

      let profitMargin = 0;

      if(sales > 0){
        profitMargin =
          profit / sales;
      }

      const normalizedProfitMargin =
        Math.max(
          0,
          Math.min(
            1,
            profitMargin / 0.5
          )
        );

      const profitScore =
        normalizedProfitMargin * 40;


      /* -----------------------------------------------
         CASH POSITION — 30 POINTS
      ------------------------------------------------ */

      const cashPosition =
        sales - expenses;

      let cashRatio = 0;

      if(sales > 0){

        cashRatio =
          Math.max(
            0,
            Math.min(
              1,
              cashPosition / sales
            )
          );

      }

      const cashScore =
        cashRatio * 30;


      /* -----------------------------------------------
         DEBT HEALTH — 20 POINTS
      ------------------------------------------------ */

      const outstandingDebt =
        credit + debit;

      let debtRatio = 0;

      if(sales > 0){

        debtRatio =
          outstandingDebt / sales;

      }

      const debtScore =
        Math.max(
          0,
          20 -
          Math.min(
            20,
            debtRatio * 20
          )
        );


      /* -----------------------------------------------
         SALES ACTIVITY — 10 POINTS
      ------------------------------------------------ */

      let activityScore = 0;

      if(sales > 0){
        activityScore = 10;
      }


      let score =
        Math.round(
          profitScore +
          cashScore +
          debtScore +
          activityScore
        );


      score =
        Math.max(
          0,
          Math.min(
            100,
            score
          )
        );


      let status;
      let message;
      let color;


      if(score >= 75){

        status = "Healthy";

        message =
          "Your business is in a strong financial position.";

        color = "#16a34a";

      }
      else if(score >= 50){

        status = "Watch";

        message =
          "Your business is doing fairly well, but some areas need attention.";

        color = "#ea580c";

      }
      else{

        status = "Attention";

        message =
          "Your business finances need closer attention.";

        color = "#dc2626";

      }


      return {

        score,
        status,
        message,
        color,

        profitScore:
          Math.round(profitScore),

        cashScore:
          Math.round(cashScore),

        debtScore:
          Math.round(debtScore),

        activityScore:
          Math.round(activityScore)

      };

    }

                    t.type === "debit"

    /* =====================================================
       SAVE TRANSACTION
    ===================================================== */

    function saveTransaction(event){

      event.preventDefault();


      const form =
        event.target;


      const data =
        new FormData(form);


      const type =
        data.get("type");


      const amount =
        Number(
          data.get("amount")
        );


      const item =
        String(
          data.get("item") || ""
        ).trim();


      const date =
        data.get("date");


      const note =
        String(
          data.get("note") || ""
        ).trim();


      let party =
        data.get("party");


      if(
        currentCustomerMode === "new"
      ){

        const input =
          document.getElementById(
            "newPartyInput"
          );

        party =
          String(
            input?.value || ""
          ).trim();


        if(!party){

          toast(
            "Please enter a name."
          );

          return;

        }


        const list =
          currentPartyType === "customer"
            ? customers
            : vendors;


        if(
          !list.some(
            x =>
              x.toLowerCase() ===
              party.toLowerCase()
          )
        ){

          list.push(party);

        }

      }


      if(
        !amount ||
        amount <= 0
      ){

        toast(
          "Please enter a valid amount."
        );

        return;

      }


      const transaction = {

        id:
          "tx_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2,7),

        type,

        amount,

        item,

        party,

        date,

        note,

        createdAt:
          new Date().toISOString(),

        status:
          (
            type === "credit" ||
            type === "debit"
          )
            ? "Outstanding"
            : "Completed",

        balance:
          (
            type === "credit" ||
            type === "debit"
          )
            ? amount
            : 0,

        payments:[]

      };


      transactions.push(
        transaction
      );


      save();

      closeModal();

      render();


      toast(
        "Transaction saved successfully."
      );

    }

    function saveEditedTransaction(
      event,
      id
    ){

      event.preventDefault();


      const form =
        event.target;


      const data =
        new FormData(form);


      const t =
        transactions.find(
          x => x.id === id
        );


      if(!t) return;


      const oldType =
        t.type;


      const newType =
        data.get("type");


      const newAmount =
        Number(
          data.get("amount")
        );


      t.type =
        newType;

      t.amount =
        newAmount;

      t.item =
        String(
          data.get("item") || ""
        ).trim();

      t.party =
        String(
          data.get("party") || ""
        ).trim();

      t.date =
        data.get("date");

      t.note =
        String(
          data.get("note") || ""
        ).trim();


      if(
        newType !== "credit" &&
        newType !== "debit"
      ){

        t.balance = 0;

        t.status =
          "Completed";

      }
      else{

        if(
          oldType !== "credit" &&
          oldType !== "debit"
        ){

          t.balance =
            newAmount;

          t.status =
            "Outstanding";

        }
        else{

          const previousPaid =
            Number(t.amount || 0) -
            Number(t.balance || 0);

          t.balance =
            Math.max(
              0,
              newAmount -
              previousPaid
            );

          t.status =
            t.balance === 0
              ? "Completed"
              : "Part paid";

        }

      }


      save();

      closeModal();

      render();

      toast(
        "Transaction updated."
      );

    }

    function savePayment(
      event,
      id
    ){

      event.preventDefault();


      const t =
        transactions.find(
          x => x.id === id
        );


      if(!t) return;


      const form =
        event.target;


      const data =
        new FormData(form);


      const paid =
        Number(
          data.get("paymentAmount")
        );


      const date =
        data.get("paymentDate");


      if(
        !paid ||
        paid <= 0
      ){

        toast(
          "Enter a valid payment amount."
        );

        return;

      }


      if(
        paid >
        Number(t.balance)
      ){

        toast(
          "Payment cannot be greater than the outstanding balance."
        );

        return;

      }


      if(!Array.isArray(t.payments)){

        t.payments = [];

      }


      t.payments.push({

        id:
          "pay_" +
          Date.now(),

        amount:paid,

        date:String(date || "")

      });


      t.balance =
        Math.max(
          0,
          Number(t.balance) -
          paid
        );


      t.lastPaymentDate =
        String(
          date || ""
        );


      t.status =
        t.balance === 0
          ? "Completed"
          : "Part paid";


      save();

      closeModal();

      render();


      toast(
        t.balance === 0
          ? "Debt fully settled."
          : "Payment recorded successfully."
      );

    }


    /* =====================================================
       FILTER LEDGER
    ===================================================== */

    function filterLedger(){

      const search =
        String(
          document.getElementById(
            "ledgerSearch"
          )?.value || ""
        )
        .toLowerCase()
        .trim();


      const type =
        document.getElementById(
          "ledgerType"
        )?.value || "";


      let list =
        [...transactions];


      if(search){

        list =
          list.filter(t =>

            [
              t.item,
              t.party,
              t.note,
              typeLabel(t.type)
            ]
              .join(" ")
              .toLowerCase()
              .includes(search)

          );

      }


      if(type){

        list =
          list.filter(
            t => t.type === type
          );

      }


      const body =
        document.getElementById(
          "ledgerBody"
        );


      if(body){

        body.innerHTML =
          ledgerRows(list);

      }

    }


    /* =====================================================
       PEOPLE
    ===================================================== */

    function addPerson(type){

      const label =
        type === "customer"
          ? "Customer"
          : "Vendor";


      const modal =
        document.getElementById(
          "modalBox"
        );


      modal.innerHTML = `

        <div class="modal-header">

          <div>

            <h2>
              Add ${label}
            </h2>

            <p>
              Add a new ${label.toLowerCase()} to your list.
            </p>

          </div>

          <button
            class="modal-close"
            onclick="closeModal()"
          >
            ×
          </button>

        </div>


        <form
          onsubmit="
            savePerson(
              event,
              '${type}'
            )
          "
        >

          <div class="modal-body">

            <div class="field">

              <label>
                ${label} Name
              </label>

              <input
                name="name"
                placeholder="Enter ${label.toLowerCase()} name"
                required
              />

            </div>

          </div>


          <div class="modal-footer">

            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Add ${label}
            </button>

          </div>

        </form>

      `;


      openModal();

    }


    function savePerson(
      event,
      type
    ){

      event.preventDefault();


      const data =
        new FormData(
          event.target
        );


      const name =
        String(
          data.get("name") || ""
        ).trim();


      if(!name) return;


      const list =
        type === "customer"
          ? customers
          : vendors;


      if(
        list.some(
          x =>
            x.toLowerCase() ===
            name.toLowerCase()
        )
      ){

        toast(
          `${type === "customer" ? "Customer" : "Vendor"} already exists.`
        );

        return;

      }


      list.push(name);

      save();

      closeModal();

      render();

      toast(
        `${type === "customer" ? "Customer" : "Vendor"} added.`
      );

    }


    function editPerson(
      type,
      index
    ){

      const list =
        type === "customer"
          ? customers
          : vendors;


      const name =
        list[index];


      if(!name) return;


      const label =
        type === "customer"
          ? "Customer"
          : "Vendor";


      const modal =
        document.getElementById(
          "modalBox"
        );


      modal.innerHTML = `

        <div class="modal-header">

          <div>

            <h2>
              Edit ${label}
            </h2>

            <p>
              Update this ${label.toLowerCase()}'s name.
            </p>

          </div>

          <button
            class="modal-close"
            onclick="closeModal()"
          >
            ×
          </button>

        </div>


        <form
          onsubmit="
            saveEditedPerson(
              event,
              '${type}',
              ${index}
            )
          "
        >

          <div class="modal-body">

            <div class="field">

              <label>
                ${label} Name
              </label>

              <input
                name="name"
                value="${esc(name)}"
                required
              />

            </div>

          </div>


          <div class="modal-footer">

            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Save Changes
            </button>

          </div>

        </form>

      `;


      openModal();

    }


    function saveEditedPerson(
      event,
      type,
      index
    ){

      event.preventDefault();


      const data =
        new FormData(
          event.target
        );


      const newName =
        String(
          data.get("name") || ""
        ).trim();


      if(!newName) return;


      const list =
        type === "customer"
          ? customers
          : vendors;


      const oldName =
        list[index];


      if(
        list.some(
          (x,i) =>
            i !== index &&
            x.toLowerCase() ===
            newName.toLowerCase()
        )
      ){

        toast(
          "That name already exists."
        );

        return;

      }


      list[index] =
        newName;


      transactions.forEach(
        t => {

          if(t.party === oldName){

            t.party =
              newName;

          }

        }
      );


      save();

      closeModal();

      render();

      toast(
        "Updated successfully."
      );

    }


    function deletePerson(
      type,
      index
    ){

      const list =
        type === "customer"
          ? customers
          : vendors;


      const name =
        list[index];


      if(!name) return;


      const label =
        type === "customer"
          ? "customer"
          : "vendor";


      openConfirmation(
        `Delete ${label}`,
        `
          Are you sure you want to delete
          <strong>
            ${esc(name)}
          </strong>?
          <br><br>
          Existing transactions will not be deleted.
        `,
        () =>
          confirmDeletePerson(
            type,
            index
          )
      );

    }


    function confirmDeletePerson(
      type,
      index
    ){

      const list =
        type === "customer"
          ? customers
          : vendors;


      if(!list[index]) return;


      list.splice(
        index,
        1
      );


      save();

      closeModal();

      render();

      toast(
        "Deleted successfully."
      );

    }


    /* =====================================================
       CONFIRMATION MODAL
    ===================================================== */

    function openConfirmation(
      title,
      message,
      action
    ){

      const modal =
        document.getElementById(
          "modalBox"
        );


      modal.innerHTML = `

        <div class="modal-header">

          <div>

            <h2>
              ${title}
            </h2>

            <p>
              Please confirm this action.
            </p>

          </div>

          <button
            class="modal-close"
            onclick="closeModal()"
          >
            ×
          </button>

        </div>


        <div class="modal-body">

          <div
            style="
              font-size:13px;
              color:#475569;
              line-height:1.7;
            "
          >
            ${message}
          </div>

        </div>


        <div class="modal-footer">

          <button
            class="btn btn-secondary"
            onclick="closeModal()"
          >
            Cancel
          </button>

          <button
            class="btn btn-danger"
            id="confirmActionBtn"
          >
            Confirm
          </button>

        </div>

      `;


      document
        .getElementById(
          "confirmActionBtn"
        )
        .onclick =
          action;


      openModal();

    }


    /* =====================================================
       MODAL CONTROLS
    ===================================================== */

    function openModal(){

      document
        .getElementById(
          "modalOverlay"
        )
        .classList.add("show");

    }


    function closeModal(){

      document
        .getElementById(
          "modalOverlay"
        )
        .classList.remove("show");

    }


    document
      .getElementById(
        "modalOverlay"
      )
      .addEventListener(
        "click",
        function(event){

          if(
            event.target === this
          ){

            closeModal();

          }

        }
      );


    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Escape"
        ){

          closeModal();

        }

      }
    );


    /* =====================================================
       CLEAR DATA
    ===================================================== */

    function confirmClearData(){

      openConfirmation(
        "Clear All Data",
        `
          This will permanently delete all
          transactions, customers and vendors
          stored in this browser.
          <br><br>
          <strong>
            This action cannot be undone.
          </strong>
        `,
        clearData
      );

    }


    function clearData(){

      transactions = [];

      customers = [];

      vendors = [];


      save();

      closeModal();

      render();

      toast(
        "All data has been cleared."
      );

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function toast(message){

      const container =
        document.getElementById(
          "toastContainer"
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "toast";


      item.textContent =
        message;


      container.appendChild(
        item
      );


      setTimeout(
        () => {

          item.style.opacity = "0";

          item.style.transform =
            "translateY(8px)";

          setTimeout(
            () => item.remove(),
            200
          );

        },
        2500
      );

    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    function updateConnection(){

      const connection =
        document.getElementById(
          "connection"
        );

      const text =
        document.getElementById(
          "connectionText"
        );


      if(
        navigator.onLine
      ){

        connection.classList.remove(
          "offline"
        );

        text.textContent =
          "Online";

      }
      else{

        connection.classList.add(
          "offline"
        );

        text.textContent =
          "Offline";

      }

    }


    window.addEventListener(
      "online",
      updateConnection
    );


    window.addEventListener(
      "offline",
      updateConnection
    );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    updateConnection();

    render();

  </script>

</body>
</html>
